<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCHRP Radio · Mapa</title>
<link rel="stylesheet" href="mapa.css">
</head>
<body>
<header class="barra">
  <div class="leyenda" id="leyenda" aria-label="Leyenda">
    <span class="chip" data-c="pd"><i></i>Policía <b id="n-pd">0</b></span>
    <span class="chip" data-c="cfd"><i></i>Bomberos <b id="n-cfd">0</b></span>
    <span class="chip" data-c="ems"><i></i>EMS <b id="n-ems">0</b></span>
    <span class="chip" data-c="isp" id="chip-isp" hidden><i></i>ISP <b id="n-isp">0</b></span>
  </div>
  <div class="herr">
    <label class="check"><input id="ver-nombres" type="checkbox"> Nombres</label>
    <button id="menos" type="button" class="b" aria-label="Alejar" title="Alejar">−</button>
    <button id="mas" type="button" class="b" aria-label="Acercar" title="Acercar">+</button>
    <button id="centrar" type="button" class="b ancho" title="Ver todo el mapa">Centrar</button>
  </div>
</header>
<div id="caja">
  <canvas id="lienzo"></canvas>
  <div id="tip" class="tip" hidden></div>
  <p id="aviso" class="aviso" role="status" aria-live="polite">Cargando unidades…</p>
  <p id="hora" class="hora"></p>
</div>
<script src="mapa-calibracion.js"></script>
<script src="mapa.js"></script>
</body>
</html>
